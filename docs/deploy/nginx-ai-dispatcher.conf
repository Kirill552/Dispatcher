# ai-dispatcher.ru — nginx reverse proxy
# Сайт (Fastify :3000) + OpenClaw webchat (:18790)
#
# Установка:
#   sudo cp nginx-ai-dispatcher.conf /etc/nginx/sites-available/ai-dispatcher
#   sudo ln -s /etc/nginx/sites-available/ai-dispatcher /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream fastify_site {
    server 127.0.0.1:3000;
}

upstream openclaw_gw {
    server 127.0.0.1:18790;
}

# Rate limiting: webchat — 10 запросов/мин на IP
limit_req_zone $binary_remote_addr zone=webchat:10m rate=10r/m;

# Rate limiting: сайт — 30 запросов/мин на IP
limit_req_zone $binary_remote_addr zone=site:10m rate=30r/m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name ai-dispatcher.ru www.ai-dispatcher.ru;
    return 301 https://ai-dispatcher.ru$request_uri;
}

# www -> non-www redirect
server {
    listen 443 ssl;
    server_name www.ai-dispatcher.ru;

    ssl_certificate /etc/letsencrypt/live/ai-dispatcher.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-dispatcher.ru/privkey.pem;

    return 301 https://ai-dispatcher.ru$request_uri;
}

# Основной сервер
server {
    listen 443 ssl http2;
    server_name ai-dispatcher.ru;

    ssl_certificate /etc/letsencrypt/live/ai-dispatcher.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-dispatcher.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Заголовки безопасности
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ограничение размера тела запроса
    client_max_body_size 1m;

    # --- OpenClaw webchat: ТОЛЬКО /webchat/* ---

    # WebSocket endpoint
    location /webchat/ws {
        limit_req zone=webchat burst=5 nodelay;

        proxy_pass http://openclaw_gw/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # OpenAI-compatible API endpoint
    location /webchat/v1/chat/completions {
        limit_req zone=webchat burst=5 nodelay;

        proxy_pass http://openclaw_gw/v1/chat/completions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Блокируем всё остальное к OpenClaw
    location /webchat/ {
        return 404;
    }

    # --- Сайт: всё остальное -> Fastify ---

    location / {
        limit_req zone=site burst=20 nodelay;

        proxy_pass http://fastify_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика с кешированием (CSS, JS, изображения)
    location /public/ {
        proxy_pass http://fastify_site;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt и sitemap.xml
    location = /robots.txt {
        proxy_pass http://fastify_site;
    }

    location = /sitemap.xml {
        proxy_pass http://fastify_site;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
    }
}
